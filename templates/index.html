<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AL FAROOJ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ece5dd;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background-color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background-color: #075e54;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }
    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #dcdcdc;
    }
    .message {
      margin: 10px 0;
      max-width: 80%;
      padding: 10px;
      border-radius: 7px;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background-color: #dcf8c6;
    }
    .message.bot {
      align-self: flex-start;
      background-color: #fff;
      border: 1px solid #ccc;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }
    .chat-input input {
      flex: 1;
      border: none;
      padding: 15px;
      font-size: 16px;
    }
    .chat-input button {
      background-color: #075e54;
      border: none;
      color: white;
      padding: 15px;
      cursor: pointer;
      font-size: 16px;
    }
    .chat-input input:focus {
      outline: none;
    }
    img {
      max-width: 100%;
      border-radius: 7px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">WhatsApp </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="message-input" placeholder="Type a message..." />
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const sendButton = document.getElementById("send-button");
    const messageInput = document.getElementById("message-input");
    const chatMessages = document.getElementById("chat-messages");

    function appendMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendImages(images) {
      images.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        const imgContainer = document.createElement("div");
        imgContainer.classList.add("message", "bot");
        imgContainer.appendChild(img);
        chatMessages.appendChild(imgContainer);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      appendMessage(message, "user");
      messageInput.value = "";
      
      fetch("/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      })
      .then(response => response.json())
      .then(data => {
        appendMessage(data.text, "bot");
        if (data.menu_images) {
          appendImages(data.menu_images);
        }
      })
      .catch(err => {
        console.error(err);
        appendMessage("Error: Could not process message.", "bot");
      });
    }

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
